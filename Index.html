<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<meta name="theme-color" content="#0a0a0a">
<title>Tracker Séances</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#0a0a0a; --red:#e8001d; --red-dim:#6b0010; --red-bg:rgba(232,0,29,0.08);
    --white:#f5f0e8; --gray:#1a1a1a; --gray2:#222; --mid:#2e2e2e; --muted:#555;
    --accent:#ff4d00; --green:#00c851; --green-bg:rgba(0,200,81,0.1);
    --blue:#4d9fff; --blue-bg:rgba(77,159,255,0.08); --blue-dim:#1a4a80;
    --purple:#a855f7; --purple-bg:rgba(168,85,247,0.08); --purple-dim:#4a1a80;
    --teal:#2dd4bf; --teal-bg:rgba(45,212,191,0.08); --teal-dim:#115e59;
    --amber:#f59e0b; --amber-bg:rgba(245,158,11,0.08); --amber-dim:#78490a;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--black); color:var(--white); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:80px; }

  .header { position:sticky; top:0; z-index:100; background:rgba(10,10,10,0.97); backdrop-filter:blur(12px); border-bottom:1px solid var(--mid); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
  .header-title { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; line-height:1; }
  .header-title span { color:var(--red); }
  .header-date { font-size:10px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  .header-actions { display:flex; gap:8px; }
  .btn { border:none; border-radius:6px; font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:1px; padding:7px 10px; cursor:pointer; }
  .btn-red { background:var(--red); color:var(--white); }
  .btn-ghost { background:var(--gray2); color:#888; border:1px solid var(--mid); }
  .btn-ghost.active { color:var(--white); border-color:#555; }

  .session-tabs { display:flex; border-bottom:1px solid var(--mid); background:rgba(10,10,10,0.97); position:sticky; top:57px; z-index:99; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .session-tabs::-webkit-scrollbar { display:none; }
  .tab { flex:1 0 auto; padding:11px 10px; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:1px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all .2s; }
  .tab.active-legs { color:var(--red); border-bottom-color:var(--red); }
  .tab.active-arms { color:var(--blue); border-bottom-color:var(--blue); }
  .tab.active-chest { color:var(--purple); border-bottom-color:var(--purple); }

  .progress-bar-wrap { padding:0 18px 14px; background:rgba(10,10,10,0.97); }
  .progress-track { height:3px; background:var(--mid); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; border-radius:2px; transition:width .4s ease; width:0%; }
  .progress-fill.legs { background:var(--red); }
  .progress-fill.arms { background:var(--blue); }
  .progress-fill.chest { background:var(--purple); }
  .progress-label { font-size:9px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:5px; display:flex; justify-content:space-between; }

  #legs-view, #arms-view, #chest-view, #history-view { display:none; }

  .exo-block { margin:16px 16px 0; border-radius:12px; overflow:hidden; border:1px solid var(--mid); background:var(--gray); }
  .exo-header { padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; user-select:none; }
  .exo-num { font-family:'Bebas Neue',sans-serif; font-size:28px; line-height:1; min-width:36px; opacity:.5; }
  .exo-num.c-legs { color:var(--red-dim); } .exo-num.c-arms { color:var(--blue-dim); } .exo-num.c-chest { color:var(--purple-dim); }
  .exo-info { flex:1; }
  .exo-name { font-family:'Bebas Neue',sans-serif; font-size:18px; line-height:1.1; }
  .exo-name-b { font-size:12px; color:#777; margin-top:2px; }
  .exo-target { font-size:9px; letter-spacing:2px; text-transform:uppercase; margin-top:3px; }
  .exo-target.c-legs { color:var(--accent); } .exo-target.c-arms { color:var(--blue); } .exo-target.c-chest { color:var(--purple); }
  .ss-badge { display:inline-block; font-size:8px; letter-spacing:2px; font-weight:700; padding:2px 6px; border-radius:3px; text-transform:uppercase; margin-bottom:3px; }
  .ss-badge.c-arms { background:var(--blue-bg); color:var(--blue); border:1px solid var(--blue-dim); }
  .ss-badge.c-chest { background:var(--purple-bg); color:var(--purple); border:1px solid var(--purple-dim); }
  .solo-badge { display:inline-block; font-size:8px; letter-spacing:2px; font-weight:700; padding:2px 6px; border-radius:3px; text-transform:uppercase; margin-bottom:3px; background:rgba(255,255,255,0.05); color:#666; border:1px solid var(--mid); }
  .exo-status { font-size:18px; min-width:24px; text-align:center; }
  .exo-chevron { color:var(--muted); font-size:11px; transition:transform .2s; }
  .exo-block.open .exo-chevron { transform:rotate(180deg); }
  .exo-body { display:none; padding:0 16px 16px; border-top:1px solid var(--mid); }
  .exo-block.open .exo-body { display:block; }

  .target-hint { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; padding:10px 12px; border-radius:8px; }
  .target-hint.c-legs { background:rgba(255,77,0,.06); border-left:2px solid var(--accent); }
  .target-hint.c-arms { background:var(--blue-bg); border-left:2px solid var(--blue); }
  .target-hint.c-chest { background:var(--purple-bg); border-left:2px solid var(--purple); }
  .hint-item { display:flex; flex-direction:column; gap:2px; }
  .hint-val { font-family:'Bebas Neue',sans-serif; font-size:16px; line-height:1; }
  .hint-val.c-legs { color:var(--accent); } .hint-val.c-arms { color:var(--blue); } .hint-val.c-chest { color:var(--purple); }
  .hint-lbl { font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }

  .serie-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); padding:8px 0 6px; }
  .serie-row { display:grid; grid-template-columns:28px 1fr 1fr 80px; gap:8px; align-items:center; margin-bottom:8px; padding:10px 12px; background:var(--gray2); border-radius:8px; border:1px solid transparent; transition:border-color .2s,background .2s; }
  .serie-row.done-ok { border-color:rgba(0,200,81,.3); background:rgba(0,200,81,.04); }
  .serie-row.done-ko { border-color:rgba(232,0,29,.3); background:rgba(232,0,29,.04); }
  .serie-num { font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--muted); text-align:center; line-height:1; }
  .input-wrap { display:flex; flex-direction:column; gap:2px; }
  .input-lbl { font-size:8px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  .perf-input { background:rgba(255,255,255,.05); border:1px solid var(--mid); border-radius:6px; color:var(--white); font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; padding:7px 10px; width:100%; outline:none; -webkit-appearance:none; }
  .perf-input:focus { border-color:var(--red); }
  .perf-input::placeholder { color:#333; font-weight:300; }
  .status-btns { display:flex; gap:6px; flex-direction:column; }
  .status-btn { border:1px solid var(--mid); border-radius:6px; background:var(--gray2); font-size:16px; padding:5px 0; cursor:pointer; text-align:center; line-height:1; }
  .status-btn.sel-ok { background:var(--green-bg); border-color:var(--green); }
  .status-btn.sel-ko { background:var(--red-bg); border-color:var(--red); }

  .ss-divider { display:flex; align-items:center; gap:8px; margin:12px 0 8px; }
  .ss-divider-line { flex:1; height:1px; background:var(--mid); }
  .ss-divider-lbl { font-size:8px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); white-space:nowrap; }

  .notes-wrap { margin-top:12px; }
  .notes-input { width:100%; background:var(--gray2); border:1px solid var(--mid); border-radius:8px; color:#888; font-family:'DM Sans',sans-serif; font-size:12px; padding:10px 12px; outline:none; resize:none; min-height:52px; }
  .notes-input:focus { border-color:var(--muted); color:var(--white); }
  .notes-input::placeholder { color:#333; }

  .save-wrap { padding:24px 16px 0; }
  .save-btn { width:100%; color:var(--white); border:none; border-radius:10px; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:2px; padding:16px; cursor:pointer; }
  .save-btn.legs { background:var(--red); }
  .save-btn.arms { background:var(--blue); }
  .save-btn.chest { background:var(--purple); }

  .autosave-info { margin:10px 16px 0; padding:10px 14px; background:rgba(0,200,81,.06); border:1px solid rgba(0,200,81,.2); border-radius:8px; font-size:11px; color:var(--green); line-height:1.6; }

  .history-filter { display:flex; gap:6px; padding:16px 16px 0; flex-wrap:wrap; }
  .filter-btn { padding:7px 10px; font-family:'Bebas Neue',sans-serif; font-size:11px; letter-spacing:1px; border-radius:6px; border:1px solid var(--mid); background:var(--gray2); color:var(--muted); cursor:pointer; }
  .filter-btn.active { color:var(--white); border-color:#555; background:var(--mid); }
  .history-empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:13px; }
  .h-entry { margin:12px 16px 0; background:var(--gray); border-radius:12px; overflow:hidden; border:1px solid var(--mid); cursor:pointer; }
  .h-entry-hdr { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  .h-date { font-family:'Bebas Neue',sans-serif; font-size:16px; }
  .h-type { font-size:9px; letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
  .h-type.legs { color:var(--red); } .h-type.arms { color:var(--blue); } .h-type.chest { color:var(--purple); }
  .h-score { display:flex; gap:6px; }
  .s-ok { font-size:11px; color:var(--green); background:var(--green-bg); padding:3px 8px; border-radius:4px; font-weight:600; }
  .s-ko { font-size:11px; color:var(--red); background:var(--red-bg); padding:3px 8px; border-radius:4px; font-weight:600; }
  .h-detail { display:none; border-top:1px solid var(--mid); padding:12px 16px; }
  .h-entry.open .h-detail { display:block; }
  .h-exo-row { padding:6px 0; border-bottom:1px solid rgba(255,255,255,.04); }
  .h-exo-row:last-child { border-bottom:none; }
  .h-exo-name { font-size:10px; font-weight:600; color:#777; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .h-chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { font-size:10px; padding:3px 7px; border-radius:4px; background:var(--gray2); border:1px solid var(--mid); color:#666; }
  .chip.ok { border-color:rgba(0,200,81,.3); color:var(--green); background:var(--green-bg); }
  .chip.ko { border-color:rgba(232,0,29,.3); color:#ff6b6b; background:var(--red-bg); }
  .del-btn { margin:10px 0 0; background:none; border:1px solid var(--mid); color:var(--muted); border-radius:6px; font-size:11px; padding:6px 12px; cursor:pointer; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; padding:10px 20px; border-radius:8px; opacity:0; transition:all .3s; pointer-events:none; white-space:nowrap; z-index:999; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.ok { background:var(--green); color:#000; }
  .toast.err { background:var(--red); color:#fff; }

  /* 4 onglets */
  .session-tabs .tab { letter-spacing:.5px; font-size:10.5px; white-space:nowrap; }
  .tab.active-mob { color:var(--teal); border-bottom-color:var(--teal); }
  .progress-fill.mob { background:var(--teal); }
  #mob-view, #neck-view { display:none; }

  /* MOBILITÉ */
  .mob-head { margin:16px 16px 0; padding:18px 16px; border:1px solid var(--mid); border-radius:12px; background:var(--gray); }
  .mob-date { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:2px; line-height:1; text-transform:uppercase; }
  .mob-sub { font-size:9px; letter-spacing:3px; color:var(--teal); text-transform:uppercase; margin-top:5px; }
  .mob-count-row { display:flex; align-items:flex-end; justify-content:space-between; margin-top:16px; }
  .mob-count { font-family:'Bebas Neue',sans-serif; font-size:56px; line-height:.9; }
  .mob-count small { font-size:26px; color:var(--muted); }
  .mob-badge { font-size:10px; letter-spacing:2px; font-weight:700; padding:7px 11px; border-radius:6px; border:1px solid var(--mid); color:var(--muted); text-transform:uppercase; }
  .mob-badge.doing { color:var(--teal); border-color:var(--teal-dim); background:var(--teal-bg); }
  .mob-badge.done { color:#000; background:var(--teal); border-color:var(--teal); }
  .mob-week { display:flex; gap:6px; margin-top:16px; }
  .mob-day { flex:1; text-align:center; }
  .mob-day-l { font-size:9px; letter-spacing:1px; color:var(--muted); margin-bottom:5px; }
  .mob-day.today .mob-day-l { color:var(--white); }
  .mob-dot { height:26px; border-radius:7px; border:1px solid var(--mid); background:var(--gray2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; }
  .mob-dot.part { background:var(--teal-bg); border-color:var(--teal-dim); color:var(--teal); }
  .mob-dot.full { background:var(--teal); border-color:var(--teal); color:#000; }
  .mob-day.today .mob-dot { outline:1px solid var(--white); outline-offset:1px; }
  .mob-streak { margin-top:12px; font-size:11px; color:#888; letter-spacing:1px; }
  .mob-name { font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.5px; line-height:1.1; }
  .mob-desc { font-size:11px; font-weight:300; color:#777; line-height:1.5; margin-top:3px; }
  .mob-reset { width:100%; background:none; border:1px solid var(--mid); color:var(--muted); border-radius:10px; font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; padding:12px; cursor:pointer; }

  /* COU */
  .tab.active-neck { color:var(--amber); border-bottom-color:var(--amber); }
  .progress-fill.neck { background:var(--amber); }
  .h-type.neck { color:var(--amber); }
  .save-btn.neck { background:var(--amber); color:#000; }
  .exo-num.c-neck { color:var(--amber-dim); }
  .exo-target.c-neck { color:var(--amber); }
  .target-hint.c-neck { background:var(--amber-bg); border-left:2px solid var(--amber); }
  .hint-val.c-neck { color:var(--amber); }
  .cues { margin-bottom:12px; }
  .cue { display:flex; gap:8px; margin-bottom:6px; }
  .cue-dot { width:5px; height:5px; border-radius:50%; background:var(--amber); margin-top:6px; flex-shrink:0; }
  .cue-txt { font-size:12px; font-weight:300; color:#aaa; line-height:1.6; }
  .neck-sched { margin:16px 16px 0; padding:16px; border:1px solid var(--mid); border-radius:12px; background:var(--gray); }
  .neck-sched-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .neck-sched-lbl { font-size:9px; letter-spacing:3px; color:var(--amber); text-transform:uppercase; }
  .neck-badge { font-size:10px; letter-spacing:2px; font-weight:700; padding:6px 10px; border-radius:6px; border:1px solid var(--mid); color:var(--muted); text-transform:uppercase; white-space:nowrap; }
  .neck-badge.due { color:#000; background:var(--amber); border-color:var(--amber); }
  .neck-badge.rest { color:var(--green); border-color:rgba(0,200,81,.3); background:var(--green-bg); }
  .neck-sched-line { margin-top:10px; font-size:13px; }
  .neck-warn { margin-top:10px; font-size:11px; font-weight:300; color:#888; line-height:1.5; }

  /* MOBILITÉ : répétitions + succès / échec */
  .mob-score { margin-top:10px; font-size:12px; color:#888; letter-spacing:1px; min-height:16px; }
  .mob-row { margin:10px 16px 0; padding:14px; background:var(--gray); border:1px solid var(--mid); border-radius:12px; transition:border-color .2s, background .2s; }
  .mob-row.ok { border-color:rgba(0,200,81,.3); background:rgba(0,200,81,.04); }
  .mob-row.ko { border-color:rgba(232,0,29,.3); background:rgba(232,0,29,.04); }
  .mob-top { display:flex; gap:12px; align-items:flex-start; }
  .mob-num { font-family:'Bebas Neue',sans-serif; font-size:28px; line-height:1; color:var(--teal-dim); min-width:26px; }
  .mob-info { flex:1; }
  .mob-ctrl { display:flex; gap:10px; align-items:flex-end; margin-top:12px; }
  .mob-ctrl .input-wrap { flex:1; }
  .mob-ctrl .status-btns { flex-direction:row; }
  .mob-ctrl .status-btn { width:56px; height:38px; font-size:18px; padding:0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">TRACK <span>SÉANCES</span></div>
    <div class="header-date" id="current-date"></div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btn-history" onclick="showView('history')">HISTORIQUE</button>
    <button class="btn btn-red" onclick="confirmNew()">+ SESSION</button>
  </div>
</div>

<div class="session-tabs" id="session-tabs">
  <div class="tab" id="tab-legs"  onclick="showView('legs')">🦵 JAMBES</div>
  <div class="tab" id="tab-arms"  onclick="showView('arms')">💪 BRAS</div>
  <div class="tab" id="tab-chest" onclick="showView('chest')">🏋️ PECS/DOS</div>
  <div class="tab" id="tab-mob"   onclick="showView('mob')">🧘 MOBILITÉ</div>
  <div class="tab" id="tab-neck"  onclick="showView('neck')">🦴 COU</div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-track"><div class="progress-fill" id="prog-fill"></div></div>
  <div class="progress-label"><span id="prog-text">—</span><span id="prog-pct">—</span></div>
</div>

<div id="legs-view"></div>
<div id="arms-view"></div>
<div id="chest-view"></div>
<div id="mob-view"></div>
<div id="neck-view"></div>

<div id="history-view">
  <div style="padding:16px 18px 8px;display:flex;align-items:center;gap:14px">
    <button onclick="showView(lastView)" style="background:var(--gray2);border:1px solid var(--mid);border-radius:8px;color:var(--white);font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:1px;padding:8px 14px;cursor:pointer;flex-shrink:0">← RETOUR</button>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px">HISTORIQUE <span style="color:var(--red)">SÉANCES</span></div>
  </div>
  <div class="history-filter">
    <div class="filter-btn active" id="f-all"   onclick="setFilter('all')">TOUT</div>
    <div class="filter-btn" id="f-legs"  onclick="setFilter('legs')">🦵 JAMBES</div>
    <div class="filter-btn" id="f-arms"  onclick="setFilter('arms')">💪 BRAS</div>
    <div class="filter-btn" id="f-chest" onclick="setFilter('chest')">🏋️ PECS/DOS</div>
    <div class="filter-btn" id="f-neck"  onclick="setFilter('neck')">🦴 COU</div>
  </div>
  <div id="history-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIGS ────────────────────────────────────────────────────────────────
var LEGS_EXOS = [
  {name:'Hack Squat',           target:'Quadriceps · Amplitude profonde',       reps:'8–10',     tempo:'3-1-2-0', recup:"2'30"},
  {name:'Leg Extension',        target:'Quadriceps · Isolation peak',           reps:'12–15',    tempo:'2-2-1-0', recup:"1'45"},
  {name:'SDL Roumain haltères', target:'Ischios · Stretch maximal',             reps:'8–10',     tempo:'3-1-1-0', recup:"2'30"},
  {name:'Hip Thrust Smith',     target:'Fessiers · Contraction peak',           reps:'10–15',    tempo:'1-2-1-0', recup:"2'00"},
  {name:'Bulgarian Split Squat',target:'Quad · Fessier · Unilatéral',           reps:'10/jambe', tempo:'3-0-1-0', recup:"2'30"},
];
var ARMS_SS = [
  {a:'Traction prise neutre',          b:'Dips',                       repsA:'6–8',   repsB:'8–10',  recup:"2'30", target:'Dos · Biceps / Pectoraux · Triceps'},

  var a=[]; for(var i=0;i<n;i++) a.push({kg:'',reps:'',status:''}); return a;
}

function initData() {
  var i;
  for(i=0;i<LEGS_EXOS.length;i++)    DATA['legs-'+i] = makeEmpty(3);
  for(i=0;i<NECK_EXOS.length;i++)    DATA['neck-'+i] = makeEmpty(3);

  for(i=0;i<CHEST_BLOCKS.length;i++) {

    else { DATA['chest-'+i+'-a']=makeEmpty(b.sets||3); DATA['chest-'+i+'-b']=makeEmpty(b.sets||3); }
  }
}

  var i;

  for(i=0;i<CHEST_BLOCKS.length;i++) {
    var b=CHEST_BLOCKS[i];
    if(b.type==='solo') { if(!DATA['chest-'+i]) DATA['chest-'+i]=makeEmpty(b.sets||4); }

function renderNeckSchedule() {
  var el=document.getElementById('neck-sched'); if(!el) return;
  var last=null, i;
  for(i=0;i<HISTORY.length;i++) if(HISTORY[i].type==='neck') { last=HISTORY[i]; break; }
  var today=new Date(); today.setHours(0,0,0,0);
  var cls, badge, line;
  if(!last) {
    cls='due'; badge='À FAIRE AUJOURD\u2019HUI'; line='Aucune séance enregistrée pour le moment.';
  } else {
    var ld=new Date(last.date); ld.setHours(0,0,0,0);
    var since=Math.round((today-ld)/86400000);
    var next=new Date(ld); next.setDate(next.getDate()+NECK_INTERVAL);
    var nextStr=next.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    var lastStr=ld.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
    if(since>=NECK_INTERVAL) {
      cls='due'; badge='À FAIRE AUJOURD\u2019HUI';
      line='Dernière séance : '+lastStr+(since>NECK_INTERVAL?' · en retard de '+(since-NECK_INTERVAL)+' j':'');
    } else {
      var rem=NECK_INTERVAL-since;
      cls='rest'; badge=since===0?'SÉANCE FAITE ✓':'REPOS';
      line='Prochaine séance : '+nextStr+' (dans '+rem+' jour'+(rem>1?'s':'')+')';
    }
  }
  el.innerHTML='<div class="neck-sched-top"><div class="neck-sched-lbl">1 séance tous les '+NECK_INTERVAL+' jours</div>'
    +'<div class="neck-badge '+cls+'">'+badge+'</div></div>'
    +'<div class="neck-sched-line">'+line+'</div>'
    +'<div class="neck-warn">Charges légères, mouvements lents et contrôlés. Arrête-toi en cas de douleur ou de fourmillements.</div>';
}

var TAB_LABELS = {legs:'Jambes', arms:'Bras / Épaules', chest:'Pecs / Dos', neck:'Cou'};
function tabLen(type) {
  return type==='legs'?LEGS_EXOS.length:type==='arms'?ARMS_SS.length:type==='chest'?CHEST_BLOCKS.length:NECK_EXOS.length;
}
function resetTab(type) {
  var i, b;
  if(type==='legs') { for(i=0;i<LEGS_EXOS.length;i++) DATA['legs-'+i]=makeEmpty(3); }
  else if(type==='arms') { for(i=0;i<ARMS_SS.length;i++){ DATA['arms-'+i+'-a']=makeEmpty(3); DATA['arms-'+i+'-b']=makeEmpty(3); } }
  else if(type==='neck') { for(i=0;i<NECK_EXOS.length;i++) DATA['neck-'+i]=makeEmpty(3); }
  else {
    for(i=0;i<CHEST_BLOCKS.length;i++){
      b=CHEST_BLOCKS[i];
      if(b.type==='solo') DATA['chest-'+i]=makeEmpty(b.sets||4);
      else { DATA['chest-'+i+'-a']=makeEmpty(b.sets||3); DATA['chest-'+i+'-b']=makeEmpty(b.sets||3); }
    }
  }
  for(i=0;i<tabLen(type);i++){
    delete DATA['note-'+type+'-'+i];
    var nt=document.getElementById('nt-'+type+'-'+i); if(nt) nt.value='';
    var st=document.getElementById('st-'+type+'-'+i); if(st) st.textContent='—';
  }
}
function confirmNew() {
  var t=currentView==='history'?lastView:currentView;
  if(t==='mob') { mobReset(); return; }
  if(confirm('Nouvelle séance '+TAB_LABELS[t]+' ? Les données en cours de cet onglet seront effacées (l\u2019historique reste intact).')) {
    resetTab(t);
    renderAllSeries();
    saveToStorage();
    updateProgress();
    showToast('NOUVELLE SÉANCE PRÊTE',false);
  }
}

// ── SERIES ─────────────────────────────────────────────────────────────────
function renderSeries(key) {
  var c=document.getElementById('sr-'+key); if(!c) return;
  var d=DATA[key]; if(!d) return;
  var html='';
  for(var i=0;i<d.length;i++){
    var s=d[i];
    html+='<div class="serie-row'+(s.status==='✅'?' done-ok':s.status==='❌'?' done-ko':'')+'">'
      +'<div class="serie-num">'+(i+1)+'</div>'
      +'<div class="input-wrap"><div class="input-lbl">KG</div>'
      +'<input class="perf-input" type="number" inputmode="decimal" placeholder="—" value="'+s.kg+'" onchange="setVal(\''+key+'\','+i+',\'kg\',this.value)"/></div>'
      +'<div class="input-wrap"><div class="input-lbl">REPS</div>'
      +'<input class="perf-input" type="number" inputmode="numeric" placeholder="—" value="'+s.reps+'" onchange="setVal(\''+key+'\','+i+',\'reps\',this.value)"/></div>'
      +'<div class="status-btns">'
      +'<button class="status-btn'+(s.status==='✅'?' sel-ok':'')+'" onclick="setStatus(\''+key+'\','+i+',\'✅\')">✅</button>'
      +'<button class="status-btn'+(s.status==='❌'?' sel-ko':'')+'" onclick="setStatus(\''+key+'\','+i+',\'❌\')">❌</button>'
      +'</div></div>';
  }
  c.innerHTML=html;
}

function setVal(key,i,field,val) {
  DATA[key][i][field]=val;
  saveToStorage();
  updateProgress();
}

function setStatus(key,i,status) {
  DATA[key][i].status = DATA[key][i].status===status ? '' : status;
  renderSeries(key);
  updateBlockStatus(key);
  updateProgress();
  saveToStorage();
}

function saveNotes(type,i) {
  var nt=document.getElementById('nt-'+type+'-'+i);
  if(nt) { DATA['note-'+type+'-'+i]=nt.value; saveToStorage(); }
}

function updateBlockStatus(key) {
  var parts=key.split('-'), type=parts[0], idx=parts[1], ab=parts[2];
  var stEl=document.getElementById('st-'+type+'-'+idx); if(!stEl) return;
  var arr=ab ? (DATA[type+'-'+idx+'-a']||[]).concat(DATA[type+'-'+idx+'-b']||[]) : (DATA[key]||[]);
  stEl.textContent=getIcon(arr);
}

function getIcon(arr) {
  var done=0,ok=0,ko=0;
  for(var i=0;i<arr.length;i++){if(arr[i].status!=='')done++;if(arr[i].status==='✅')ok++;if(arr[i].status==='❌')ko++;}
  if(!arr.length) return '—';
  if(done===arr.length) return ko===0?'🔥':ok>ko?'💪':'😤';
  if(done>0) return '⏳';
  return '—';
}

function updateProgress() {
  var keys=[],i,fill=document.getElementById('prog-fill');
  if(currentView==='mob') {
    var mc=mobCount(), mt=MOB_EXOS.length, mp=Math.round(mc/mt*100);
    fill.className='progress-fill mob'; fill.style.width=mp+'%';
    document.getElementById('prog-text').textContent=mc+' / '+mt+' exercices';
    document.getElementById('prog-pct').textContent=mp+'%';
    return;
  }
  if(currentView==='legs')  { for(i=0;i<LEGS_EXOS.length;i++) keys.push('legs-'+i); fill.className='progress-fill legs'; }
  else if(currentView==='arms')  { for(i=0;i<ARMS_SS.length;i++){keys.push('arms-'+i+'-a');keys.push('arms-'+i+'-b');} fill.className='progress-fill arms'; }
  else if(currentView==='chest') { for(i=0;i<CHEST_BLOCKS.length;i++){if(CHEST_BLOCKS[i].type==='solo')keys.push('chest-'+i);else{keys.push('chest-'+i+'-a');keys.push('chest-'+i+'-b');}} fill.className='progress-fill chest'; }
  if(currentView==='neck') { for(i=0;i<NECK_EXOS.length;i++) keys.push('neck-'+i); fill.className='progress-fill neck'; }
  var total=0,done=0;
  for(var k=0;k<keys.length;k++){var d=DATA[keys[k]];if(!d)continue;total+=d.length;for(var j=0;j<d.length;j++)if(d[j].status!=='')done++;}
  var pct=total>0?Math.round(done/total*100):0;
  fill.style.width=pct+'%';
  document.getElementById('prog-text').textContent=done+' / '+total+' séries';
  document.getElementById('prog-pct').textContent=pct+'%';
}

function toggleBlock(key) {
  var el=document.getElementById('eb-'+key); if(!el) return;
  el.classList.toggle('open');
  el.querySelector('.exo-chevron').textContent=el.classList.contains('open')?'▲':'▼';
}

// ── VIEWS ──────────────────────────────────────────────────────────────────
function showView(v) {
  if(v!=='history') lastView=v;
  currentView=v;
  ['legs','arms','chest','mob','neck','history'].forEach(function(x){document.getElementById(x+'-view').style.display=v===x?'block':'none';});
  var tabs=document.getElementById('session-tabs');
  tabs.style.display=v==='history'?'none':'flex';
  ['legs','arms','chest','mob','neck'].forEach(function(x){document.getElementById('tab-'+x).className='tab'+(v===x?' active-'+x:'');});
  if(v!=='history') { var te=document.getElementById('tab-'+v); if(te) tabs.scrollLeft=te.offsetLeft-(tabs.clientWidth-te.offsetWidth)/2; }
  document.getElementById('btn-history').classList.toggle('active',v==='history');
  updateProgress();
  if(v==='history') renderHistory();
  if(v==='mob') renderMobility();
  if(v==='neck') renderNeckSchedule();
  window.scrollTo(0,0);
}

function restoreNotesFields() {
  var types=['legs','arms','chest','neck'], i;
  for(var t=0;t<types.length;t++){
    var type=types[t];
    var len=tabLen(type);
    for(i=0;i<len;i++){
      var nt=document.getElementById('nt-'+type+'-'+i);
      if(nt && DATA['note-'+type+'-'+i]) nt.value=DATA['note-'+type+'-'+i];
    }
  }
}

function restoreAllStatuses() {
  var i;
  for(i=0;i<LEGS_EXOS.length;i++) updateBlockStatus('legs-'+i);
  for(i=0;i<NECK_EXOS.length;i++) updateBlockStatus('neck-'+i);
  for(i=0;i<ARMS_SS.length;i++)   { updateBlockStatus('arms-'+i+'-a'); }
  for(i=0;i<CHEST_BLOCKS.length;i++) {
    if(CHEST_BLOCKS[i].type==='solo') updateBlockStatus('chest-'+i);
    else updateBlockStatus('chest-'+i+'-a');
  }
}

// ── SAVE SESSION TO HISTORY ────────────────────────────────────────────────
function saveSession(type) {
  var entry={id:Date.now(),date:new Date().toISOString(),type:type,data:{},notes:[]},i;
  if(type==='legs'){
    for(i=0;i<LEGS_EXOS.length;i++){entry.data[i]=JSON.parse(JSON.stringify(DATA['legs-'+i]||[]));entry.notes.push(DATA['note-legs-'+i]||'');}
  } else if(type==='arms'){
    for(i=0;i<ARMS_SS.length;i++){entry.data[i]={a:JSON.parse(JSON.stringify(DATA['arms-'+i+'-a']||[])),b:JSON.parse(JSON.stringify(DATA['arms-'+i+'-b']||[]))};entry.notes.push(DATA['note-arms-'+i]||'');}
  } else if(type==='neck'){
    for(i=0;i<NECK_EXOS.length;i++){entry.data[i]=JSON.parse(JSON.stringify(DATA['neck-'+i]||[]));entry.notes.push(DATA['note-neck-'+i]||'');}
  } else {
    for(i=0;i<CHEST_BLOCKS.length;i++){
      if(CHEST_BLOCKS[i].type==='solo') entry.data[i]=JSON.parse(JSON.stringify(DATA['chest-'+i]||[]));
      else entry.data[i]={a:JSON.parse(JSON.stringify(DATA['chest-'+i+'-a']||[])),b:JSON.parse(JSON.stringify(DATA['chest-'+i+'-b']||[]))};
      entry.notes.push(DATA['note-chest-'+i]||'');
    }
  }
  HISTORY.unshift(entry);
  saveToStorage();
  if(type==='neck') renderNeckSchedule();
  showToast('SÉANCE ENREGISTRÉE 🔥',false);
}

// ── HISTORY ────────────────────────────────────────────────────────────────
function setFilter(f) {
  historyFilter=f;
  ['all','legs','arms','chest','neck'].forEach(function(x){document.getElementById('f-'+x).classList.toggle('active',x===f);});
  renderHistory();
}

function renderHistory() {
  var list=document.getElementById('history-list');
  var entries=HISTORY.filter(function(e){return historyFilter==='all'||e.type===historyFilter;});
  if(!entries.length){list.innerHTML='<div class="history-empty">Aucune séance enregistrée.</div>';return;}
  var html='';
  for(var ei=0;ei<entries.length;ei++){
    var entry=entries[ei];
    var d=new Date(entry.date);
    var ds=d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',year:'2-digit'}).toUpperCase();
    var ok=0,ko=0,detail='';
    var typeLabel=entry.type==='legs'?'🦵 JAMBES':entry.type==='arms'?'💪 BRAS / ÉPAULES':entry.type==='neck'?'🦴 COU':'🏋️ PECS / DOS';
    var exos=entry.type==='legs'?LEGS_EXOS:entry.type==='arms'?ARMS_SS:entry.type==='neck'?NECK_EXOS:CHEST_BLOCKS;
    for(var i=0;i<exos.length;i++){
      var ed=entry.data[i]; if(!ed) continue;
      var note=entry.notes&&entry.notes[i]?'<div style="font-size:10px;color:#555;margin-top:3px;font-style:italic">'+entry.notes[i]+'</div>':'';
      if(entry.type==='legs'||entry.type==='neck'){
        var chips='';
        (Array.isArray(ed)?ed:[]).forEach(function(sx){var cls=sx.status==='✅'?'ok':sx.status==='❌'?'ko':'';if(sx.status==='✅')ok++;if(sx.status==='❌')ko++;chips+='<span class="chip '+cls+'">'+(sx.kg||'?')+'kg×'+(sx.reps||'?')+' '+(sx.status||'—')+'</span>';});
        detail+='<div class="h-exo-row"><div class="h-exo-name">'+exos[i].name+'</div><div class="h-chips">'+chips+'</div>'+note+'</div>';
      } else if(entry.type==='arms'){
        var chA='',chB='';
        (ed.a||[]).forEach(function(sx){var cls=sx.status==='✅'?'ok':sx.status==='❌'?'ko':'';if(sx.status==='✅')ok++;if(sx.status==='❌')ko++;chA+='<span class="chip '+cls+'">'+(sx.kg||'?')+'kg×'+(sx.reps||'?')+' '+(sx.status||'—')+'</span>';});
        (ed.b||[]).forEach(function(sx){var cls=sx.status==='✅'?'ok':sx.status==='❌'?'ko':'';if(sx.status==='✅')ok++;if(sx.status==='❌')ko++;chB+='<span class="chip '+cls+'">'+(sx.kg||'?')+'kg×'+(sx.reps||'?')+' '+(sx.status||'—')+'</span>';});
        detail+='<div class="h-exo-row"><div class="h-exo-name">'+ARMS_SS[i].a+'</div><div class="h-chips">'+chA+'</div><div class="h-exo-name" style="margin-top:5px">'+ARMS_SS[i].b+'</div><div class="h-chips">'+chB+'</div>'+note+'</div>';
      } else {
        var bl=CHEST_BLOCKS[i];
        if(bl.type==='solo'){
          var chips='';
          (Array.isArray(ed)?ed:[]).forEach(function(sx){var cls=sx.status==='✅'?'ok':sx.status==='❌'?'ko':'';if(sx.status==='✅')ok++;if(sx.status==='❌')ko++;chips+='<span class="chip '+cls+'">'+(sx.kg||'?')+'kg×'+(sx.reps||'?')+' '+(sx.status||'—')+'</span>';});
          detail+='<div class="h-exo-row"><div class="h-exo-name">'+bl.name+'</div><div class="h-chips">'+chips+'</div>'+note+'</div>';
        } else {
          var chA='',chB='';
          (ed.a||[]).forEach(function(sx){var cls=sx.status==='✅'?'ok':sx.status==='❌'?'ko':'';if(sx.status==='✅')ok++;if(sx.status==='❌')ko++;chA+='<span class="chip '+cls+'">'+(sx.kg||'?')+'kg×'+(sx.reps||'?')+' '+(sx.status||'—')+'</span>';});
          (ed.b||[]).forEach(function(sx){var cls=sx.status==='✅'?'ok':sx.status==='❌'?'ko':'';if(sx.status==='✅')ok++;if(sx.status==='❌')ko++;chB+='<span class="chip '+cls+'">'+(sx.kg||'?')+'kg×'+(sx.reps||'?')+' '+(sx.status||'—')+'</span>';});
          detail+='<div class="h-exo-row"><div class="h-exo-name">'+bl.a+'</div><div class="h-chips">'+chA+'</div><div class="h-exo-name" style="margin-top:5px">'+bl.b+'</div><div class="h-chips">'+chB+'</div>'+note+'</div>';
        }
      }
    }
    html+='<div class="h-entry" id="he-'+entry.id+'" onclick="toggleHEntry(\''+entry.id+'\')">'
      +'<div class="h-entry-hdr"><div><div class="h-date">'+ds+'</div><div class="h-type '+entry.type+'">'+typeLabel+'</div></div>'
      +'<div class="h-score">'+(ok?'<span class="s-ok">✅ '+ok+'</span>':'')+(ko?'<span class="s-ko">❌ '+ko+'</span>':'')+'</div></div>'
      +'<div class="h-detail">'+detail+'<button class="del-btn" onclick="delEntry(event,\''+entry.id+'\')">Supprimer</button></div>'
      +'</div>';
  }
  list.innerHTML=html;
}

function toggleHEntry(id){var el=document.getElementById('he-'+id);if(el)el.classList.toggle('open');}

function delEntry(e,id){
  e.stopPropagation();
  if(confirm('Supprimer cette séance ?')){
    HISTORY=HISTORY.filter(function(s){return s.id!=id;});
    saveToStorage(); renderHistory(); renderNeckSchedule();
    showToast('Séance supprimée',true);
  }
}

function showToast(msg,isErr){
  var t=document.getElementById('toast');t.textContent=msg;
  t.className='toast show '+(isErr?'err':'ok');
  setTimeout(function(){t.className='toast '+(isErr?'err':'ok');},2500);
}

function renderAllSeries(){
  var i;
  for(i=0;i<LEGS_EXOS.length;i++) renderSeries('legs-'+i);
  for(i=0;i<NECK_EXOS.length;i++) renderSeries('neck-'+i);
  for(i=0;i<ARMS_SS.length;i++){renderSeries('arms-'+i+'-a');renderSeries('arms-'+i+'-b');}
  for(i=0;i<CHEST_BLOCKS.length;i++){
    if(CHEST_BLOCKS[i].type==='solo') renderSeries('chest-'+i);
    else{renderSeries('chest-'+i+'-a');renderSeries('chest-'+i+'-b');}
  }
}

// ── MOBILITÉ (routine quotidienne) ─────────────────────────────────────────
var MOB_EXOS = [
  {name:'Écart assis · relevés de jambe',      desc:'Assis jambes écartées, mains au sol. Soulève une jambe, contrôle, repose. Alterne.'},
  {name:'Pigeon assis · flexion avant',        desc:'Assis, une jambe repliée devant. Penche le buste vers l\u2019avant, dos long, respire.'},
  {name:'Grand écart facial · flexion avant',  desc:'Jambes écartées au maximum. Descends le buste et la poitrine vers le sol.'},
  {name:'Squat profond · appuis mains',        desc:'Squat bas, mains au sol. Ouvre les genoux avec les coudes, transfère le poids d\u2019un côté à l\u2019autre.'},
  {name:'90/90 · bascules de hanches',         desc:'Assis, genoux à 90°. Fais basculer les genoux d\u2019un côté à l\u2019autre.'},
  {name:'Pigeon · relevés de jambe arrière',   desc:'Position pigeon, mains au sol. Décolle la jambe tendue derrière toi, repose.'},
  {name:'Essuie-glaces assis',                 desc:'Assis, appui sur les mains, genoux fléchis. Fais tomber les genoux d\u2019un côté puis de l\u2019autre.'},
  {name:'Squat profond · rotation thoracique', desc:'Squat bas, une main au sol. Ouvre l\u2019autre bras vers le ciel en suivant du regard.'},
  {name:'Squat latéral (Cossack)',             desc:'Jambes très écartées. Descends sur une jambe, l\u2019autre tendue, puis bascule de l\u2019autre côté.'}
];
var MOB = {};

function dateKey(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadMob() {
  try { var m=localStorage.getItem('tracker_mobility'); if(m) MOB=JSON.parse(m)||{}; } catch(e) { MOB={}; }
}
function saveMob() {
  try { localStorage.setItem('tracker_mobility', JSON.stringify(MOB)); } catch(e) {}
}
// Chaque exercice = {reps, status}. Anciennes données (case cochée = true) converties en ✅.
function mobNorm(v) {
  if(v && typeof v==='object') return {reps:v.reps||'', status:v.status||''};
  return {reps:'', status:(v===true?'✅':'')};
}
function mobDay(key) {
  var a=MOB[key], out=[];
  for(var i=0;i<MOB_EXOS.length;i++) out.push(mobNorm(a&&a[i]));
  return out;
}
function mobToday() {
  var k=dateKey(new Date());
  MOB[k]=mobDay(k);
  return MOB[k];
}
// "fait" = un résultat (✅ ou ❌) est enregistré, comme pour les séries des autres onglets
function mobCountOf(key) {
  var a=mobDay(key), n=0;
  for(var i=0;i<a.length;i++) if(a[i].status!=='') n++;
  return n;
}
function mobOkOf(key) {
  var a=mobDay(key), n=0;
  for(var i=0;i<a.length;i++) if(a[i].status==='✅') n++;
  return n;
}
function mobCount() { return mobCountOf(dateKey(new Date())); }
function mobStreak() {
  var d=new Date();
  if(mobCountOf(dateKey(d))<MOB_EXOS.length) d.setDate(d.getDate()-1);
  var n=0;
  while(mobCountOf(dateKey(d))===MOB_EXOS.length) { n++; d.setDate(d.getDate()-1); }
  return n;
}

function buildMobility() {
  loadMob();
  var html='<div class="mob-head">'
    +'<div class="mob-date" id="mob-date"></div>'
    +'<div class="mob-sub">Routine mobilité · objectif du jour</div>'
    +'<div class="mob-count-row"><div class="mob-count"><span id="mob-n">0</span><small>/'+MOB_EXOS.length+'</small></div>'
    +'<div class="mob-badge" id="mob-badge">À FAIRE</div></div>'
    +'<div class="mob-score" id="mob-score"></div>'
    +'<div class="mob-week" id="mob-week"></div>'
    +'<div class="mob-streak" id="mob-streak"></div>'
    +'</div>'
    +'<div id="mob-list"></div>'
    +'<div class="save-wrap"><button class="mob-reset" onclick="mobReset()">RÉINITIALISER AUJOURD\u2019HUI</button></div>';
  document.getElementById('mob-view').innerHTML=html;
  renderMobility();
}

function renderMobility() {
  var el=document.getElementById('mob-list'); if(!el) return;
  var today=mobToday(), now=new Date(), i;
  var n=mobCount(), ok=mobOkOf(dateKey(now)), ko=n-ok;

  document.getElementById('mob-date').textContent=now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('mob-n').textContent=n;
  var b=document.getElementById('mob-badge');
  if(n===MOB_EXOS.length) { b.textContent='OBJECTIF VALIDÉ ✓'; b.className='mob-badge done'; }
  else if(n>0)            { b.textContent='EN COURS';          b.className='mob-badge doing'; }
  else                    { b.textContent='À FAIRE';           b.className='mob-badge'; }
  document.getElementById('mob-score').textContent=n>0?('✅ '+ok+'   ❌ '+ko):'';

  var html='';
  for(i=0;i<MOB_EXOS.length;i++) {
    var m=today[i];
    html+='<div class="mob-row'+(m.status==='✅'?' ok':m.status==='❌'?' ko':'')+'">'
      +'<div class="mob-top"><div class="mob-num">'+(i+1)+'</div>'
      +'<div class="mob-info"><div class="mob-name">'+MOB_EXOS[i].name+'</div>'
      +'<div class="mob-desc">'+MOB_EXOS[i].desc+'</div></div></div>'
      +'<div class="mob-ctrl">'
      +'<div class="input-wrap"><div class="input-lbl">REPS</div>'
      +'<input class="perf-input" type="number" inputmode="numeric" placeholder="—" value="'+m.reps+'" oninput="mobSetReps('+i+',this.value)"/></div>'
      +'<div class="status-btns">'
      +'<button class="status-btn'+(m.status==='✅'?' sel-ok':'')+'" onclick="mobSetStatus('+i+',\'✅\')">✅</button>'
      +'<button class="status-btn'+(m.status==='❌'?' sel-ko':'')+'" onclick="mobSetStatus('+i+',\'❌\')">❌</button>'
      +'</div></div></div>';
  }
  el.innerHTML=html;

  var letters=['D','L','M','M','J','V','S'], wk='';
  for(i=6;i>=0;i--) {
    var d=new Date(); d.setDate(d.getDate()-i);
    var c=mobCountOf(dateKey(d));
    var cls=c===MOB_EXOS.length?'full':c>0?'part':'';
    wk+='<div class="mob-day'+(i===0?' today':'')+'"><div class="mob-day-l">'+letters[d.getDay()]+'</div>'
      +'<div class="mob-dot '+cls+'">'+(c===MOB_EXOS.length?'✓':(c>0?c:''))+'</div></div>';
  }
  document.getElementById('mob-week').innerHTML=wk;
  var s=mobStreak();
  document.getElementById('mob-streak').textContent=s>0?('🔥 '+s+' jour'+(s>1?'s':'')+' d\u2019affilée'):'Valide les '+MOB_EXOS.length+' exercices pour lancer ta série';
  if(currentView==='mob') updateProgress();
}

function mobSetReps(i, val) {
  var t=mobToday(); t[i].reps=val; saveMob();
}

function mobSetStatus(i, st) {
  var before=mobCount(), t=mobToday();
  t[i].status = t[i].status===st ? '' : st;
  saveMob();
  renderMobility();
  if(before<MOB_EXOS.length && mobCount()===MOB_EXOS.length) showToast('OBJECTIF DU JOUR VALIDÉ 🔥',false);
}

function mobReset() {
  if(confirm('Effacer les répétitions et résultats d\u2019aujourd\u2019hui ?')) {
    MOB[dateKey(new Date())]=null; saveMob(); mobToday(); renderMobility();
  }
}

// Nouveau jour ou retour dans l'app : rafraîchit la date, la mobilité et le planning cou
document.addEventListener('visibilitychange', function() {
  if(!document.hidden) {
    document.getElementById('current-date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
    renderMobility();
    renderNeckSchedule();
  }
});

// ── INIT ───────────────────────────────────────────────────────────────────
function init(){
  document.getElementById('current-date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
  loadFromStorage();
  ensureDataKeys();
  buildLegs(); buildArms(); buildChest(); buildNeck(); buildMobility();
  renderAllSeries();
  restoreNotesFields();
  restoreAllStatuses();
  showView('legs');
}

init();
</script>
